<style>
  :root { --ui: 16px; --tb: 84px; --tg: 18px; --sl: 0px; --sr: 0px; --sb: 0px; --st: 0px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #140f2a; overflow: hidden; overscroll-behavior: none;
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif; color: #24264a;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
  body { position: fixed; inset: 0; }
  #wrap { position: absolute; left: 0; top: 0; overflow: hidden; }
  #safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
  code, pre { font-family: "Fira Code", Consolas, "Courier New", monospace; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; }
  code { background: #24264a; color: #9ef0a6; padding: .05em .35em; border-radius: .3em; font-size: .92em; white-space: nowrap; }
  pre { margin: 0; background: #1d1b3a; color: #e8e9ff; padding: .6em .8em; border-radius: .5em; text-align: left; font-size: .95em; line-height: 1.4; white-space: pre-wrap; }
  .kw { color: #ff9ecd; } .str { color: #ffd479; } .num { color: #9fd8ff; } .fn { color: #9ef0a6; } .cm { color: #8a88b0; font-style: italic; }

  /* HUD */
  #hud { position: absolute; left: 0; top: 0; right: 0; display: none; gap: .5em; align-items: center;
    padding: .45em .6em; font-size: 1em; pointer-events: none; z-index: 3; }
  #hud .pill { background: rgba(20,15,42,.82); color: #fff; border: 2px solid #4b3d8f; border-radius: 2em; padding: .2em .75em; font-weight: 700; white-space: nowrap; }
  #hud .grow { flex: 1; }
  #hearts { color: #ff4d6a; letter-spacing: .08em; }
  #coinvar { background: none; color: #ffd23f; padding: 0; }
  #hint { font-size: .78em; font-weight: 600; opacity: .9; }
  .hbtn { display: inline-flex; align-items: center; justify-content: center; pointer-events: auto; font: inherit; font-weight: 900; font-size: 1.05em; border: 0; cursor: pointer;
    min-width: 44px; min-height: 44px; width: 2.5em; height: 2.5em; border-radius: 50%; background: rgba(255,255,255,.93); color: #3a22b0;
    box-shadow: 0 .15em 0 rgba(0,0,0,.3); padding: 0; touch-action: none; }
  body.in-keys .hbtn { min-width: 0; min-height: 0; width: 2em; height: 2em; font-size: 1em; }
  #toast { position: absolute; left: 50%; bottom: 1.2em; transform: translateX(-50%); background: rgba(20,15,42,.9); color: #fff; border: 2px solid #8b6cff;
    padding: .35em 1em; border-radius: 2em; font-weight: 700; display: none; z-index: 4; pointer-events: none; white-space: nowrap; }
  #toast.show { display: block; }
  body.in-boss #toast { bottom: auto; top: calc(var(--st) + 4.1em); }

  /* overlays */
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,8,24,.6); z-index: 6; }
  #overlay.show { display: flex; }
  .card { background: #fffdf6; border: .25em solid #4b3d8f; border-radius: 1em; padding: 1em 1.4em; width: 80%; max-height: 94%; overflow: auto;
    box-shadow: 0 .4em 0 rgba(0,0,0,.35); text-align: center; line-height: 1.45; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .card h1 { margin: .05em 0 .1em; font-size: 2.6em; color: #e8344e; letter-spacing: .06em; font-family: "Courier New", monospace; text-shadow: .06em .06em 0 #3a22b0; }
  .card h2 { margin: .1em 0 .35em; font-size: 1.5em; color: #3a22b0; }
  .card h3 { margin: .5em 0 .2em; font-size: 1.05em; color: #333; }
  .card p { margin: .35em 0; }
  .tag { display: inline-block; background: #ffe066; color: #5c4400; font-weight: 800; border-radius: 2em; padding: .1em .8em; font-size: .8em; letter-spacing: .05em; }
  .row { display: flex; gap: .6em; justify-content: center; flex-wrap: wrap; margin-top: .8em; }
  .cols { display: flex; gap: 1em; text-align: left; align-items: flex-start; }
  .cols > div { flex: 1; min-width: 0; }
  .btn { font: inherit; font-weight: 800; font-size: 1.02em; border: 0; border-radius: .6em; padding: .55em 1.2em; cursor: pointer; min-height: 44px;
    background: #5a3cf0; color: #fff; box-shadow: 0 .25em 0 #3a22b0; touch-action: manipulation; }
  .btn:active { transform: translateY(.15em); box-shadow: 0 .1em 0 #3a22b0; }
  .btn:focus-visible, .opt:focus-visible, .ln:focus-visible { outline: .2em solid #ffcc33; outline-offset: .15em; }
  .btn.alt { background: #e9e6ff; color: #3a22b0; box-shadow: 0 .25em 0 #b9b0f0; }
  .btn.go { background: #26b35a; box-shadow: 0 .25em 0 #168a43; }
  .btn:disabled { background: #ccc; color: #777; box-shadow: none; cursor: default; }
  .keys { font-size: .88em; color: #555; }
  kbd { display: inline-block; background: #f1f1f8; border: 1px solid #bbb; border-bottom-width: 3px; border-radius: .35em; padding: 0 .4em; font-family: inherit; font-weight: 700; font-size: .9em; }
  .tk { display: inline-block; background: #5a3cf0; color: #fff; border-radius: .4em; padding: 0 .45em; font-weight: 800; font-size: .9em; line-height: 1.4; }
  .muted { color: #777; font-size: .85em; }
  .mode { font-size: .75em; color: #8a88b0; margin: .5em 0 0; }
  .lesson { align-items: flex-start; } .lesson > div:first-child { flex: 1.1; }
  .parts { list-style: none; padding: 0; margin: .5em 0 0; font-size: .92em; }
  .parts li { display: flex; gap: .5em; align-items: baseline; margin: .25em 0; }
  .parts li code { flex: none; min-width: 4.4em; text-align: center; }
  .dots { display: flex; gap: .4em; justify-content: center; margin-top: .6em; }
  .dots i { width: .55em; height: .55em; border-radius: 50%; background: #d6d3f5; } .dots i.on { background: #5a3cf0; }

  /* code panel (door terminal) */
  .card.term { background: #0f0c22; color: #e8e9ff; border-color: #2ee6a6; box-shadow: 0 0 1.2em rgba(46,230,166,.45), 0 .4em 0 rgba(0,0,0,.4); }
  .card.term h2 { color: #2ee6a6; font-family: "Courier New", monospace; }
  .card.term .goal { color: #ffd479; font-weight: 700; }
  .card.term .muted { color: #a9a6d6; }
  .card.term kbd { color: #1d1b3a; }
  pre.prog { margin: .5em auto; max-width: 36em; border: 2px solid #2b2752; }
  pre.prog .l { display: block; padding: 0 .3em; border-radius: .3em; }
  pre.prog .l .no { display: inline-block; width: 1.6em; color: #6d6a99; }
  pre.prog .l.bug { background: rgba(232,52,78,.22); text-decoration: underline wavy #ff4d6a; text-underline-offset: .25em; }
  pre.prog .l.fixed { background: rgba(38,179,90,.25); }
  .blank { display: inline-block; min-width: 2.6em; text-align: center; border-bottom: .15em dashed #ffd23f; color: #ffd23f; background: rgba(255,210,63,.12); border-radius: .2em; }
  .opts { display: flex; flex-direction: column; gap: .5em; margin-top: .6em; }
  .opts.grid { display: grid; grid-template-columns: repeat(2, 1fr); }
  .opt { display: flex; align-items: stretch; gap: .6em; text-align: left; font: inherit; border: .18em solid #d6d3f5; background: #f7f6ff;
    border-radius: .7em; padding: .4em; cursor: pointer; color: inherit; min-height: 44px; touch-action: manipulation; }
  .term .opt { background: #1d1b3a; border-color: #3d3870; color: #e8e9ff; }
  .opt .n { background: #5a3cf0; color: #fff; font-weight: 800; border-radius: .4em; min-width: 1.8em; display: flex; align-items: center; justify-content: center; }
  .opt pre { flex: 1; background: transparent; padding: .2em .3em; }
  .opt .txt { flex: 1; align-self: center; font-weight: 700; }
  .opt.wrong { border-color: #e8344e !important; opacity: .6; } .opt.wrong .n { background: #e8344e; }
  .opt.right { border-color: #26b35a !important; } .opt.right .n { background: #26b35a; }
  #fb { margin-top: .5em; min-height: 1.4em; font-weight: 700; }
  #fb.bad { color: #ff6b81; } #fb.good { color: #2ee6a6; }
  .card:not(.term) #fb.bad { color: #c41f3a; } .card:not(.term) #fb.good { color: #168a43; }
  .order { display: flex; gap: .8em; text-align: left; margin-top: .4em; }
  .order > div { flex: 1; min-width: 0; }
  .order h3 { color: #2ee6a6; font-size: .9em; margin: .2em 0; }
  .slots, .pool { display: flex; flex-direction: column; gap: .35em; min-height: 6em; background: #17142f; border: 2px dashed #3d3870; border-radius: .6em; padding: .4em; }
  .ln { font: inherit; font-family: "Fira Code", Consolas, "Courier New", monospace; text-align: left; white-space: pre; background: #2a2650; color: #e8e9ff;
    border: 2px solid #4b3d8f; border-radius: .45em; padding: .35em .5em; cursor: pointer; min-height: 40px; touch-action: manipulation; font-size: .9em; overflow: hidden; text-overflow: ellipsis; }
  .ln .n { color: #ffd23f; font-weight: 800; margin-right: .5em; font-family: inherit; }
  .slots .ln { background: #213a33; border-color: #2ee6a6; }
  .empty { color: #6d6a99; font-size: .85em; align-self: center; margin: auto; }

  /* map */
  .dmap { display: flex; flex-direction: column; gap: .7em; margin-top: .4em; }
  .dgn { background: #1d1b3a; border-radius: .9em; padding: .6em .8em; color: #fff; text-align: left; }
  .dgn.locked { opacity: .55; }
  .dgn h3 { color: #ffd23f; margin: 0 0 .4em; }
  .path { display: flex; align-items: center; gap: .3em; flex-wrap: wrap; }
  .path .lnk { flex: 1; min-width: .6em; max-width: 2.5em; height: .3em; background: repeating-linear-gradient(90deg, #6d6a99 0 .4em, transparent .4em .7em); }
  .rbtn { font: inherit; cursor: pointer; border: .18em solid #4b3d8f; border-radius: .8em; padding: .45em .5em; color: #fff; background: #2a2650; min-width: 6.4em; min-height: 44px;
    display: flex; flex-direction: column; align-items: center; gap: .05em; box-shadow: 0 .2em 0 rgba(0,0,0,.4); touch-action: manipulation; }
  .rbtn .re { font-size: 1.4em; line-height: 1.1; } .rbtn b { font-size: .85em; } .rbtn .rt { font-size: .72em; opacity: .85; } .rbtn .rs { font-size: .72em; color: #ffd23f; }
  .rbtn.done { border-color: #26b35a; } .rbtn.cur { border-color: #ffd23f; box-shadow: 0 0 .7em rgba(255,210,63,.6); }
  .rbtn.boss { background: #4a1630; }
  .rbtn:disabled { filter: grayscale(.9) brightness(.7); cursor: not-allowed; }
  .stats { display: flex; gap: .6em; justify-content: center; flex-wrap: wrap; margin: .5em 0; }
  .stats span { background: #f1eeff; border-radius: .6em; padding: .3em .7em; font-weight: 700; }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  body.in-touch.st-play #touch { display: block; }
  #joy { position: absolute; left: calc(var(--sl) + var(--tg)); bottom: calc(var(--sb) + var(--tg)); width: calc(var(--tb) * 1.9); height: calc(var(--tb) * 1.9);
    border-radius: 50%; background: rgba(20,15,42,.35); border: 3px solid rgba(255,255,255,.55); pointer-events: auto; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%; background: rgba(255,255,255,.75);
    box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #joy.on { background: rgba(90,60,240,.45); }
  #tZap { position: absolute; right: calc(var(--sr) + var(--tg)); bottom: calc(var(--sb) + var(--tg) * 1.4); width: calc(var(--tb) * 1.2); height: calc(var(--tb) * 1.2);
    border-radius: 50%; pointer-events: auto; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
    font-weight: 900; font-size: calc(var(--tb) * .42); background: rgba(46,230,166,.45); border: 3px solid rgba(255,255,255,.75); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #tZap small { font-size: .36em; letter-spacing: .12em; font-family: Verdana, "DejaVu Sans", Tahoma, Arial, sans-serif; font-weight: 700; margin-top: .1em; }
  #tZap.on { background: rgba(46,230,166,.9); transform: translateY(2px); }
  body.dev-phone #joy { background: rgba(20,15,42,.22); }
  #tPause { display: none; }
  body.in-touch #tPause { display: inline-flex; }
  body.in-touch #hint { display: none; }
  body.dev-phone #rname, body.dev-phone #hint { display: none; }
  body.dev-phone .card { width: 95%; max-height: 97%; padding: .7em .9em; }
  body.dev-phone .card h1 { font-size: 2em; }
  /* compact code panel for short landscape screens (e.g. a phone held sideways, 844x390): code on the left,
     options + Hint/Walk away on the right, so option 4 and the Hint button are visible without scrolling */
  @media (orientation: landscape) and (max-height: 500px) {
    .card.term { width: 97%; max-height: 98%; padding: .45em .7em; line-height: 1.25; font-size: .88em; }
    .card.term .tp { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: .3em .9em; align-items: start; text-align: left; }
    .card.term .tp.ord { grid-template-columns: minmax(0, .8fr) minmax(0, 1.5fr); }
    .card.term h2 { font-size: 1.15em; margin: 0 0 .15em; }
    .card.term p { margin: .15em 0; }
    .card.term .muted { font-size: .8em; }
    .card.term pre.prog { margin: .25em 0 0; font-size: .92em; }
    .card.term .opts { gap: .3em; margin-top: .25em; }
    .card.term .opt { min-height: 40px; padding: .25em .35em; }
    .card.term #fb { margin-top: .2em; min-height: 0; font-size: .9em; }
    .card.term .hintp { display: flex; gap: .5em; margin: .25em 0 0; }
    .card.term .hintp .btn, .card.term .runp .btn { min-height: 40px; padding: .3em .9em; font-size: .95em; }
    .card.term .cols { gap: .5em; }
    .card.term .cols h3 { margin: 0 0 .15em; font-size: .9em; }
    .card.term .slots, .card.term .pool { gap: .25em; padding: .3em; min-height: 4em; }
    .card.term .ln { min-height: 36px; padding: .2em .45em; }
    .card.term .runp { margin: .25em 0 0; }
  }

  /* ---------- orientation prompts ---------- */
  #rotate { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1em;
    background: #140f2a; color: #fff; text-align: center; padding: 2em; font-size: 20px; }
  #rotate.show { display: flex; }
  body.rotated #wrap, body.rotated #touch, body.rotated #overlay, body.rotated #toast, body.rotated #tip { visibility: hidden !important; }
  .card img.logo { display: block; width: 100%; max-width: 30em; height: auto; margin: 0 auto .4em; image-rendering: pixelated; }
  .card img.logo.small { max-width: 18em; }
  .bossdone { width: 128px; height: 128px; margin: 0 auto; background: none 0 0 / 768px 128px; image-rendering: pixelated; animation: bossdn .8s steps(4) infinite; }
  @keyframes bossdn { to { background-position: -512px 0; } }
  #rotate .ph { font-size: 64px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  #rotate button { font: inherit; font-size: 14px; background: none; color: #aab; border: 1px solid #556; border-radius: 2em; padding: .5em 1.1em; min-height: 44px; }
  #tip { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--st, 0px) + 12px); z-index: 7; display: none; background: rgba(255,255,255,.14);
    color: #dfe0ff; border-radius: 2em; padding: .4em 1.1em; font-size: 15px; pointer-events: none; white-space: nowrap; }
  #tip.show { display: block; }
</style>

<body>
<div id="loading" style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#140f2a;color:#fff;font:700 22px system-ui,sans-serif">Loading… 🐛</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <span class="pill" id="hearts"></span>
    <span class="pill"><code id="coinvar">coins = 0</code></span>
    <span class="grow"></span>
    <span class="pill" id="rname"></span>
    <span class="pill" id="hint"></span>
    <button class="hbtn" id="tFs" aria-label="Fullscreen">⛶</button>
    <button class="hbtn" id="tPause" aria-label="Pause">⏸</button>
  </div>
  <div id="toast"></div>

// ---------- tiny syntax highlighter ----------
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function hl(src) {
  return esc(src).replace(/("[^"\n]*"?)|(\/\/.*$)|\b(let|const|if|else|for|while|return|true|false)\b|\b(\d+)\b|\b([a-zA-Z_][\w.]*)(?=\()/gm,
    (m, s, c, k, n, f) => s ? `<span class="str">${s}</span>` : c ? `<span class="cm">${c}</span>` : k ? `<span class="kw">${k}</span>` : n ? `<span class="num">${n}</span>` : `<span class="fn">${f}</span>`);
}

  },
  has(name) { return !!this.img[name]; },

    P(9, 12, 2, 2 - (s < 0), C.legs); P(9, 14 - (s < 0), 2, 1, C.shoe);
    P(4, 7, 8, 5, C.hood); P(4, 7, 1, 5, C.hoodD); P(11, 7, 1, 5, C.hoodD);

    if (dir === 'down') {

      P(8, 9, 1, 1, C.white); P(7, 10, 1, 1, C.white); P(7, 11, 1, 1, C.white);        // /
      P(9, 9, 1, 1, C.white); P(10, 10, 1, 1, C.white); P(9, 11, 1, 1, C.white);       // >

      P(6, 3, 1, 2, C.eye); P(9, 3, 1, 2, C.eye); P(5, 5, 1, 1, C.cheek); P(10, 5, 1, 1, C.cheek);

// ---------- the Big Bug (boss) ----------
// simple readable loop: walk → flash "!" → attack (spit 3 slow goo balls / call one little bug) → walk …
// fixing a terminal makes it dizzy: it stands still with its weak point showing until zapped `per` times.
function newBoss(L, tx, ty) {
  const R = L.R, hp = (R.boss && R.boss.hp) || 9, nT = R.terminals ? R.terminals.length : 3;
  return { x: tx * TILE + 16 - 64, y: ty * TILE + 16 - 80, baseY: ty * TILE + 16 - 80, hp, max: hp, per: Math.min(3, Math.ceil(hp / nT)), exposed: 0,
    state: 'walk', st: 2.5, vx: 40, atk: 0, flash: 0, dead: 0, plink: 0 };
}
const bossFloatY = B => B.y + 150; // boss messages float up from under its feet (the boss-room toast sits at the top)
const bossBox = B => ({ x: B.x + 22, y: B.y + 44, w: 84, h: 76 });
function updateBoss(L, dt) {
  const B = L.boss, h = L.hero; if (!B) return;
  B.flash -= dt; B.plink -= dt;
  if (B.hp <= 0) { B.dead += dt; if (B.dead > 1.6 && G.mode === 'play' && !L.solved) bossBeaten(); return; }
  B.st -= dt;
  if (B.state === 'dizzy') { if (B.exposed <= 0) { B.state = 'walk'; B.st = 2.0; } }
  else if (B.state === 'walk') {
    const tx = h.x + 12 - (B.x + 64); B.vx += Math.sign(tx) * 30 * dt; B.vx = Math.max(-45, Math.min(45, B.vx));
    B.x += B.vx * dt; if (B.x < 80 || B.x > L.W * TILE - 208) { B.x = Math.max(80, Math.min(L.W * TILE - 208, B.x)); B.vx = -B.vx; }
    B.y = B.baseY + Math.sin(G.t * 0.9) * 22;
    if (B.st <= 0) { B.state = 'windup'; B.st = 1.0; floatText(B.x + 64, B.y + 4, '!', '#ff4d6a'); }
  } else if (B.state === 'windup') {
    if (B.st <= 0) {
      const cx = B.x + 64, cy = B.y + 90;
      if (B.atk % 2 === 0) { // spit 3 slow goo balls toward the hero
        const a = Math.atan2(h.y + 12 - cy, h.x + 12 - cx);
        for (const d of [-0.35, 0, 0.35]) L.orbs.push({ x: cx - 6, y: cy - 6, w: 12, h: 12, vx: Math.cos(a + d) * 118, vy: Math.sin(a + d) * 118, life: 5 });
        SFX.spit();

        floatText(cx, B.y + 4, 'Bzzz!', '#9fd8ff');

}
function hitBoss(L, s) {
  const B = L.boss;

    B.hp--; B.exposed--; B.flash = 0.35; SFX.bossHit();
    floatText(B.x + 64, bossFloatY(B), B.hp > 0 ? (B.exposed > 0 ? `Ouch! ${B.exposed} more!` : 'Armour is back! Fix another terminal!') : 'NOOOO!', '#ffd23f');

  } else if (B.plink <= 0) {

function bossBeaten() {

// ---------- gameplay ----------
function zap() {
  const h = G.room.hero; if (h.cd > 0) return; h.cd = 0.28;
  const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[h.dir];
  G.room.shots.push({ x: h.x + 8, y: h.y + 8, w: 8, h: 8, vx: d[0] * 360, vy: d[1] * 360, life: 0.7 }); SFX.zap();
}
function hurtHero(L) {
  const h = L.hero; if (h.inv > 0) return;
  h.hp--; h.inv = 1.5; SFX.hurt(); hud();
  if (h.hp > 0) return;
  if (isBossRoom(L)) { // forgiving: keep fixed terminals and boss damage, just go back to the start
    h.hp = 3; h.inv = 2; h.x = L.start.x; h.y = L.start.y; L.orbs = []; L.bugs = L.bugs.filter(b => !b.fly);
    toast('Ouch! Back to the start. Your fixes are saved!', 2.4); hud();
  } else { const k = G.k; G.room = buildRoom(k); toast(G.room.open ? 'Ouch! The bugs got you. Room restarted – your door stays open!' : 'Ouch! The bugs got you. Room restarted.', 2.2); hud(); }
}
let doorMsgT = 0;
function update(dt) {

  document.body.classList.toggle('in-boss', isBossRoom(G.room));

  let mx = joy.x + ((keys.arrowright || keys.d) ? 1 : 0) - ((keys.arrowleft || keys.a) ? 1 : 0);
  let my = joy.y + ((keys.arrowdown || keys.s) ? 1 : 0) - ((keys.arrowup || keys.w) ? 1 : 0);
  const m = Math.hypot(mx, my); if (m > 1) { mx /= m; my /= m; }
  h.moving = m > 0.1;
  if (h.moving) { h.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 'right' : 'left') : (my > 0 ? 'down' : 'up'); h.f += dt * 8; }
  const hit = moveObj(L, h, mx * 130 * dt, my * 130 * dt);
  if (hit && hit.c === 'T') { const T = L.terms.find(t => t.x === hit.x && t.y === hit.y); if (T && !T.fixed && termsLocked(L)) { if (doorMsgT <= 0) { doorMsgT = 1.5; SFX.locked(); floatText(T.x * TILE + 16, (T.y + 2) * TILE + 8, '⚡ Zap the weak point first!', '#ffd23f'); } } else if (T && !T.fixed && L.boss && L.boss.hp > 0) { h.y += 4; return termPanel(T.i); } else if (T && T.fixed && doorMsgT <= 0) { doorMsgT = 1.5; floatText(T.x * TILE + 16, T.y * TILE, '✅ Already fixed', '#2ee6a6'); } }
  if (hit && hit.c === 'D' && !L.solved) {
    if (L.R.door.lock === 'boss') { if (doorMsgT <= 0) { doorMsgT = 1.5; SFX.locked(); floatText(hit.x * TILE + 32, TILE * 1.5, '🔒 Beat the Big Bug first!', '#ff6b81'); } }
    else { h.y += 4; return doorPanel(0); }

  }

    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;

  L.fx.forEach(f => f.t -= dt); L.fx = L.fx.filter(f => f.t > 0);
}

function drawTile(L, x, y, pal) {

    else if (c === 't') { Sprites.draw('tiles', 'wall', 0, px, py, { pal, t: G.t, top: true }); Sprites.draw('tiles', 'torch', L.lit[L.torches.findIndex(T => T.x === x && T.y === y)] ? 1 : 0, px, py, { t: G.t, n: '' }); }

    else if (cell(L, x, y + 1) === '#' || y > 0) { ctx.fillStyle = '#2a2350'; ctx.fillRect(px, py, 32, 32); ctx.fillStyle = '#4b3d8f'; ctx.fillRect(px, py, 32, 4); }

  ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#ff9ecd'; ctx.fillText('for', x + 10, y + 16); ctx.fillStyle = '#e8e9ff';
  ctx.fillText(` (let i = 0; i < ${L.torches.length}; i++)`, x + 34, y + 16);
  ctx.fillStyle = '#ffd23f'; ctx.fillText(i < L.torches.length ? `i = ${i}  →  lightTorch(${i})` : `i = ${i}  →  ${i} < ${i} is false: stop!`, x + 10, y + 33);
}
function render() {
  const W = cv.width, H = cv.height, L = G.room;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const pal = (L ? L.R.dungeon : DUNGEONS[0]).pal;
  ctx.fillStyle = pal.bg || '#0d0a1c'; ctx.fillRect(0, 0, W, H);
  if (!L) { // title backdrop: drifting bugs
    const s = Math.max(1, Math.round(Math.min(W, H) / 300));
    ctx.imageSmoothingEnabled = false;
    for (let i = 0; i < 8; i++) { const x = (i * 197 * s + G.t * 40 * s) % (W + 60 * s) - 30 * s, y = (i * 113 * s) % H; Sprites.draw(i % 3 ? 'bug' : 'fly', i % 3 ? 'walk' : 'fly', Math.floor(G.t * 8 + i), x, y, { scale: s, dir: 1, t: G.t + i }); }
    return;
  }
  const mw = L.W * TILE, mh = L.H * TILE, sc = Math.min(W / mw, H / mh);
  ctx.setTransform(sc, 0, 0, sc, Math.round((W - mw * sc) / 2), Math.round((H - mh * sc) / 2));
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) drawTile(L, x, y, pal);
  drawDoor(L);
  for (const c of L.coins) Sprites.draw('items', 'coin', 0, c.x, c.y, { t: G.t + c.x });
  for (const c of L.hearts) Sprites.draw('items', 'heart', 0, c.x, c.y, { t: G.t });
  drawBoss(L);
  for (const b of L.bugs) {
    if (b.fly) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(b.x + 13, b.y + 28, 9, 3, 0, 0, 7); ctx.fill(); Sprites.draw('fly', 'fly', Math.floor(G.t * 12), b.x - 3, b.y - 8 + Math.sin(G.t * 6 + b.x) * 2, { flip: b.dir < 0, dir: b.dir, t: G.t, col: '#5ab0ff' }); }
    else Sprites.draw('bug', 'walk', Math.floor(G.t * 8 + b.x), b.x - 3, b.y - 3, { flip: b.dir < 0, dir: b.dir, t: G.t });
  }
  for (const o of L.orbs) { ctx.fillStyle = 'rgba(232,52,140,.35)'; ctx.beginPath(); ctx.arc(o.x + 6, o.y + 6, 10, 0, 7); ctx.fill(); ctx.fillStyle = '#e8348c'; ctx.beginPath(); ctx.arc(o.x + 6, o.y + 6, 6, 0, 7); ctx.fill(); ctx.fillStyle = '#ffc2d6'; ctx.fillRect(o.x + 3, o.y + 3, 3, 3); }
  for (const s of L.shots) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(s.x, s.y, 8, 8); ctx.fillStyle = '#fff'; ctx.fillRect(s.x + 2, s.y + 2, 4, 4); }
  for (const f of L.fx) Sprites.draw('squash', 'squash', Math.min(2, Math.floor((0.45 - f.t) / 0.15)), f.x, f.y, {});
  const h = L.hero;
  // soft light under the hero so they never blend into the purple walls/floor
  const gx = h.x + 12, gy = h.y + 20, gr = ctx.createRadialGradient(gx, gy, 2, gx, gy, 26);
  gr.addColorStop(0, 'rgba(255,244,214,.55)'); gr.addColorStop(1, 'rgba(255,244,214,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(gx, gy, 26, 18, 0, 0, 7); ctx.fill();
  if (!(h.inv > 0 && Math.floor(G.t * 12) % 2)) {
    if (h.moving || !Sprites.has('heroIdle')) Sprites.draw('hero', h.dir, h.moving ? Math.floor(h.f) : 0, h.x - 4, h.y - 6);
    else Sprites.draw('heroIdle', h.dir, 0, h.x - 4, h.y - 6);
  }
  drawLoopPanel(L);
  if (L.boss) drawBossBar(L);
  ctx.textAlign = 'center'; ctx.font = 'bold 13px ' + UI_FONT; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,8,24,.9)';
  for (const f of L.floats) { ctx.globalAlpha = Math.min(1, f.t * 2); ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}
let lastT = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; try { update(dt); render(); if (gestured) syncMusic(); } catch (e) { console.error(e); } requestAnimationFrame(frame); }

// ---------- boot ----------
G.save = loadSave(); Sprites.load(); resize(); refreshCtl(); syncFsUi();
if (DEV.type !== 'desktop' || matchMedia('(pointer: coarse)').matches) goTouch();
$('loading').style.display = 'none';
titleScreen();
// re-show the title once the logo image has decoded
setTimeout(() => { if (G.mode === 'title' && Sprites.has('logo') && !document.querySelector('#card img.logo')) titleScreen(); }, 150);
requestAnimationFrame(frame);

</script>
</body>
